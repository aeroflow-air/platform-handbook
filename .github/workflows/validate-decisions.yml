name: Validate decision records

on:
  # Runs on every PR (no paths filter) because `validate` is a required status
  # check on main. A path-filtered required check never reports on PRs that
  # don't touch decisions, which would leave them blocked forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/decisions/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks
        run: python3 scripts/validate-decisions.py

      - name: Diff checks against base branch
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate-decisions.py --base origin/${{ github.base_ref }}
